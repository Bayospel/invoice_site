<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Send Invoices</title>
<style>
  body { font-family: sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; }
  label { display: block; margin-top: 16px; font-weight: bold; }
  input[type=file], input[type=text] { width: 100%; margin-top: 4px; padding: 8px; box-sizing: border-box; }
  button { margin-top: 24px; padding: 12px 20px; font-size: 16px; cursor: pointer; }
  table { margin-top: 24px; width: 100%; border-collapse: collapse; }
  td, th { border: 1px solid #ccc; padding: 6px 8px; text-align: left; font-size: 14px; }
  .ok { color: green; }
  .err { color: #b00020; }
</style>
</head>
<body>
  <h1>Send Invoices</h1>
  <p>Sending from: <code>{{ from_address }}</code></p>

  <form method="post" action="/send" enctype="multipart/form-data">
    <label>Contacts file (.txt or .pdf)
      <input type="file" name="contacts" required>
    </label>
    <label>Invoice template PDF
      <input type="file" name="invoice" required>
    </label>
    <label>Email message (.txt)
      <input type="file" name="message" required>
    </label>
    <label>Fixed subject (optional, overrides the one in the message file)
      <input type="text" name="fixed_subject" placeholder="Leave blank to use the message file's subject">
    </label>
    <button type="submit">Send Invoices</button>
  </form>

  {% if results %}
    <h2>Results</h2>
    <table>
      <tr><th>Customer</th><th>Status</th></tr>
      {% for r in results %}
        <tr>
          <td>{{ r.tag }}</td>
          <td class="{{ 'ok' if r.status == 'SENT' else 'err' }}">{{ r.status }}</td>
        </tr>
      {% endfor %}
    </table>
  {% endif %}
</body>
</html>
